name: Python CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app tests
      - name: Verify no credential files are tracked
        run: |
          test ! -e .env
          ! git grep -nE 'sk-proj-[A-Za-z0-9_-]{20,}' -- . || exit 1
